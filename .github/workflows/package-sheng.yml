name: Package Xiaomi Pad 6S Pro (sheng)

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile"
        type: choice
        options:
          - "macos-27"
          - "27"
          - "26"
          - "17"
        default: "macos-27"
      unique_chip_id:
        description: "Platform seed / Chip ID (8 hex digits)"
        required: true
        default: "1c70f6b4"
      include_userdata:
        description: "Also build userdata image (takes additional time and disk)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-sheng-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          path: UniXNU
          submodules: recursive

      - name: Check out UniXNU-sheng
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          path: device
          submodules: recursive

      - name: Check out uefi-sheng
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive

      - name: Install build tools
        run: |
          brew install dtc llvm lld cmake mtools blacktop/tap/ipsw glslang spirv-tools bison flex
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          bison --version | head -n 1
          flex --version | head -n 1
          which ipsw
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw glslangValidator bison flex; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]

      - name: Validate platform seed
        env:
          SEED: ${{ inputs.unique_chip_id || secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$SEED" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo "Error: platform seed must be an 8-digit hex value (e.g. 1c70f6b4)" >&2
            exit 1
          fi

      - name: Package boot & payload images
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id || secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-sheng
          status=$?
          set -e

          if [ $status -ne 0 ]; then
            echo "Initial package run exited with code $status. Checking if Data seed generation is required..."
            DATA_SEED_TOOL=$(find ../UniXNU/out -name "make-macos-data-seed.py" 2>/dev/null | head -n 1 || true)
            OS_DMG=$(find ../UniXNU/out/ipsw -name "*.dmg" ! -name "*.aea" 2>/dev/null | head -n 1 || true)
            RUNTIME_DIR=$(find ../UniXNU/out -type d -name "runtime" 2>/dev/null | head -n 1 || true)

            if [ -n "$DATA_SEED_TOOL" ] && [ -n "$OS_DMG" ] && [ -n "$RUNTIME_DIR" ] && [ ! -f "$RUNTIME_DIR/data.dbr" ]; then
              echo "== Found OS image: $OS_DMG"
              echo "== Creating first-install macOS Data seed using sudo..."
              mkdir -p "$RUNTIME_DIR"
              sudo python3 "$DATA_SEED_TOOL" "$OS_DMG" "$RUNTIME_DIR/data.dbr" --gib 210 --skip-setup
              echo "== Data seed created at $RUNTIME_DIR/data.dbr. Resuming package build..."
              scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-sheng
            else
              echo "Error: package.sh failed and could not automatically resolve inputs." >&2
              exit $status
            fi
          fi

      - name: Build userdata image (optional)
        if: inputs.include_userdata
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu build userdata --os "${{ inputs.os }}" -D ../device

      - name: Upload Boot & Payload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sheng-${{ inputs.os }}-boot-images
          retention-days: 7
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json

      - name: Upload Userdata Artifact (if built)
        if: inputs.include_userdata
        uses: actions/upload-artifact@v4
        with:
          name: sheng-${{ inputs.os }}-userdata
          retention-days: 7
          if-no-files-found: warn
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img
            UniXNU/out/sheng/*/*/userdata/userdata-root.json
